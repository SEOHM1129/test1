<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>반도체 상식 퀴즈 | SemiWiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#141f38",
                    "surface-container-highest": "#192540",
                    "primary": "#3766ff",
                    "secondary": "#bef500",
                    "background": "#060e20",
                    "on-surface": "#dee5ff",
                    "on-surface-variant": "#a3aac4",
                    "outline-variant": "#40485d"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .syntax-gradient { background: linear-gradient(135deg, #3766ff 0%, #95aaff 100%); }
        html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
        html:not(.dark) .bg-background { background-color: #f8fafc; }
        html:not(.dark) .bg-surface-container-high { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .option-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .option-btn:hover:not(:disabled) { transform: translateX(8px); }
        .progress-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary selection:text-on-secondary">
    <nav class="fixed top-0 w-full z-50 bg-[#060e20]/80 backdrop-blur-xl shadow-sm border-b border-outline-variant/10">
        <div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
            <a href="index.html" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[#bef500] text-3xl">memory</span>
                <div class="text-2xl font-bold text-[#dee5ff] tracking-tighter font-headline">SemiWiki</div>
            </a>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-xl bg-surface-container-high border border-outline-variant/20 flex items-center justify-center">
                    <span id="theme-icon" class="material-symbols-outlined text-secondary">dark_mode</span>
                </button>
                <a href="index.html" class="text-sm font-label text-on-surface-variant hover:text-secondary">나가기</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-8 max-w-3xl mx-auto">
        <div id="quiz-container">
            <!-- Progress -->
            <div class="mb-12">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <span class="text-secondary font-label text-xs tracking-widest uppercase">Question</span>
                        <h2 class="text-3xl font-headline font-bold" id="question-number">01/05</h2>
                    </div>
                    <div class="text-on-surface-variant text-sm font-label" id="progress-percent">20% Completed</div>
                </div>
                <div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden">
                    <div id="progress-bar" class="progress-bar h-full syntax-gradient" style="width: 20%"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="bg-surface-container-high p-8 md:p-12 rounded-3xl border border-outline-variant/10 shadow-xl mb-8">
                <p class="text-xl md:text-2xl font-headline font-bold leading-relaxed mb-10" id="question-text">
                    문제를 불러오는 중입니다...
                </p>
                <div class="grid grid-cols-1 gap-4" id="options-container">
                    <!-- Options will be injected here -->
                </div>
            </div>

            <div id="feedback-container" class="hidden animate-fade-in">
                <div class="p-6 rounded-2xl mb-8 flex items-start gap-4" id="feedback-box">
                    <span class="material-symbols-outlined text-3xl" id="feedback-icon">check_circle</span>
                    <div>
                        <h4 class="font-bold mb-1" id="feedback-title">정답입니다!</h4>
                        <p class="text-sm opacity-80" id="feedback-text"></p>
                    </div>
                </div>
                <button id="next-btn" class="w-full syntax-gradient text-white py-4 rounded-xl font-bold font-headline text-lg hover:scale-[1.02] transition-all shadow-lg">
                    다음 문제로
                </button>
            </div>
        </div>

        <!-- Result Screen (Hidden by default) -->
        <div id="result-container" class="hidden text-center animate-fade-in">
            <div class="w-24 h-24 bg-secondary/10 rounded-full flex items-center justify-center mx-auto mb-8">
                <span class="material-symbols-outlined text-secondary text-5xl">military_tech</span>
            </div>
            <h2 class="font-headline text-4xl font-bold mb-4">퀴즈 완료!</h2>
            <div class="text-6xl font-headline font-bold text-secondary mb-12" id="final-score">80점</div>
            
            <div class="bg-surface-container-high p-8 rounded-3xl border border-outline-variant/10 text-left mb-8">
                <h3 class="font-headline text-xl font-bold mb-6 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">analytics</span> 취업 역량 분석 보고서
                </h3>
                <div id="analysis-content" class="space-y-6">
                    <!-- Analysis results will be injected here -->
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4">
                <button onclick="location.reload()" class="flex-1 px-8 py-4 rounded-xl font-bold font-headline text-lg border border-outline-variant/30 hover:bg-surface-container-highest transition-all">
                    다시 도전하기
                </button>
                <a href="careers.html" class="flex-1 syntax-gradient text-white px-8 py-4 rounded-xl font-bold font-headline text-lg shadow-lg hover:scale-105 transition-all">
                    추천 직무 확인하기
                </a>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script>
        let currentQuestionIndex = 0;
        let score = 0;
        let wrongAnswers = [];
        const quizQuestions = window.semiData.quiz;

        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const questionNumber = document.getElementById('question-number');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const finalScore = document.getElementById('final-score');
        const analysisContent = document.getElementById('analysis-content');

        function loadQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            questionNumber.innerText = `${String(currentQuestionIndex + 1).padStart(2, '0')}/${String(quizQuestions.length).padStart(2, '0')}`;
            questionText.innerText = question.q;
            
            const progress = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressPercent.innerText = `${Math.round(progress)}% Completed`;

            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn w-full text-left p-5 rounded-2xl bg-surface-container-highest/50 border border-outline-variant/10 hover:border-secondary/50 hover:bg-surface-container-highest transition-all flex justify-between items-center group';
                button.innerHTML = `
                    <span class="font-medium">${option}</span>
                    <span class="material-symbols-outlined opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
                `;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });

            feedbackContainer.classList.add('hidden');
        }

        function selectOption(selectedIndex) {
            const question = quizQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.answer;
            
            // Disable all buttons
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score += (100 / quizQuestions.length);
                feedbackBox.className = 'p-6 rounded-2xl mb-8 flex items-start gap-4 bg-secondary/10 text-secondary border border-secondary/20';
                feedbackTitle.innerText = '정답입니다!';
                feedbackIcon.innerText = 'check_circle';
            } else {
                wrongAnswers.push(question);
                feedbackBox.className = 'p-6 rounded-2xl mb-8 flex items-start gap-4 bg-red-500/10 text-red-400 border border-red-500/20';
                feedbackTitle.innerText = '아쉽네요, 틀렸습니다.';
                feedbackIcon.innerText = 'cancel';
            }

            feedbackText.innerText = question.explanation;
            feedbackContainer.classList.remove('hidden');
            
            // Highlight correct and wrong options
            buttons[question.answer].classList.add('border-secondary', 'bg-secondary/10');
            if (!isCorrect) {
                buttons[selectedIndex].classList.add('border-red-500', 'bg-red-500/10');
            }
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            finalScore.innerText = `${Math.round(score)}점`;

            if (wrongAnswers.length === 0) {
                analysisContent.innerHTML = `
                    <div class="p-5 rounded-2xl bg-secondary/5 border border-secondary/10">
                        <p class="text-secondary font-bold mb-2">완벽합니다! (All Clear)</p>
                        <p class="text-sm opacity-80 leading-relaxed">모든 분야에서 뛰어난 이해도를 보여주셨습니다. 이제 실무 면접 준비나 심화 학습 로드맵을 확인해보세요.</p>
                    </div>
                `;
            } else {
                const weakCategories = [...new Set(wrongAnswers.map(q => q.category))];
                let analysisHtml = `
                    <p class="text-on-surface-variant text-sm leading-relaxed mb-4">분석 결과, 다음 개념에 대한 보완이 필요합니다:</p>
                `;
                
                weakCategories.forEach(cat => {
                    analysisHtml += `
                        <div class="p-5 rounded-2xl bg-primary/5 border border-primary/10">
                            <p class="text-primary font-bold mb-2">집중 보완 필요: ${cat}</p>
                            <p class="text-sm opacity-80 leading-relaxed">${cat} 공정의 원리와 최근 기술 동향(예: ${cat === 'Lithography' ? 'EUV, 멀티 패터닝' : '차세대 소자 구조'})을 용어 사전에서 복습해보세요.</p>
                        </div>
                    `;
                });
                analysisContent.innerHTML = analysisHtml;
            }
        }

        // Theme Toggle logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.innerText = 'light_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'dark');
            }
        });

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
