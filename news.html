<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>뉴스 인사이트 & 면접 훈련 | SemiWiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#141f38",
                    "surface-container-highest": "#192540",
                    "primary": "#3766ff",
                    "secondary": "#bef500",
                    "background": "#060e20",
                    "on-surface": "#dee5ff",
                    "on-surface-variant": "#a3aac4",
                    "outline-variant": "#40485d"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .syntax-gradient { background: linear-gradient(135deg, #3766ff 0%, #95aaff 100%); }
        html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
        html:not(.dark) .bg-background { background-color: #f8fafc; }
        html:not(.dark) .bg-surface-container-high { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .interview-input { background: rgba(6, 14, 32, 0.4); }
        html:not(.dark) .interview-input { background: #f1f5f9; }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary selection:text-on-secondary">
    <nav class="fixed top-0 w-full z-50 bg-[#060e20]/80 backdrop-blur-xl shadow-sm border-b border-outline-variant/10">
        <div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
            <a href="index.html" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[#bef500] text-3xl">memory</span>
                <div class="text-2xl font-bold text-[#dee5ff] tracking-tighter font-headline">SemiWiki</div>
            </a>
            <div class="hidden md:flex items-center gap-10">
                <a class="text-[#bef500] transition-colors font-headline" href="news.html">뉴스 인사이트</a>
                <a class="text-[#dee5ff] hover:text-[#3766ff] transition-colors font-headline" href="quiz.html">반도체 퀴즈</a>
                <a class="text-[#dee5ff] hover:text-[#3766ff] transition-colors font-headline" href="dictionary.html">용어사전</a>
                <a class="text-[#dee5ff] hover:text-[#3766ff] transition-colors font-headline" href="careers.html">취업로드맵</a>
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-xl bg-surface-container-high border border-outline-variant/20 flex items-center justify-center">
                    <span id="theme-icon" class="material-symbols-outlined text-secondary">dark_mode</span>
                </button>
                <a href="index.html" class="text-sm font-label text-on-surface-variant hover:text-secondary">메인으로</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-8 max-w-5xl mx-auto">
        <header class="mb-16">
            <h1 class="font-headline text-4xl md:text-5xl font-bold tracking-tight mb-4">뉴스 인사이트 & 면접 훈련</h1>
            <p class="text-on-surface-variant text-lg">최신 뉴스를 현직자의 시선으로 분석하고, 나만의 면접 답변을 설계해보세요.</p>
        </header>

        <div id="news-insight-container" class="space-y-12">
            <!-- News Insight Card will be injected here -->
        </div>
    </main>

    <!-- Modal for Interview Guide -->
    <div id="guide-modal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-surface-container-high w-full max-w-lg rounded-[2.5rem] border border-outline-variant/20 p-8 md:p-12 shadow-2xl scale-95 opacity-0 transition-all duration-300" id="modal-content">
            <div class="flex items-center gap-3 mb-6">
                <span class="material-symbols-outlined text-secondary text-3xl">lightbulb</span>
                <h3 class="text-2xl font-headline font-bold">합격자 답변 가이드</h3>
            </div>
            <div id="modal-text" class="text-on-surface-variant leading-relaxed mb-10 whitespace-pre-line"></div>
            <button onclick="closeModal()" class="w-full syntax-gradient text-white py-4 rounded-xl font-bold font-headline hover:scale-[1.02] transition-all">확인했습니다</button>
        </div>
    </div>

    <script src="js/data.js?v=096e3dd"></script>
    <script src="js/glossary.js?v=096e3dd"></script>
    <script>
        const newsInsightContainer = document.getElementById('news-insight-container');
        const guideModal = document.getElementById('guide-modal');
        const modalContent = document.getElementById('modal-content');
        const modalText = document.getElementById('modal-text');

        function renderNewsInsight() {
            const newsList = window.semiData.news;
            // Sort by ID or content to ensure latest (assuming current order is correct for May 6)
            newsInsightContainer.innerHTML = newsList.map(news => `
                <article class="bg-surface-container-high rounded-[3rem] border border-outline-variant/10 overflow-hidden shadow-xl mb-12">
                    <div class="grid grid-cols-1 lg:grid-cols-2">
                        <div class="relative group overflow-hidden">
                            <img src="${news.image}" class="w-full h-full object-cover min-h-[400px] group-hover:scale-105 transition-transform duration-700" alt="${news.title}">
                            <div class="absolute top-6 left-6 flex gap-2">
                                <span class="px-3 py-1 rounded-full bg-black/50 backdrop-blur-md text-white text-[10px] font-bold uppercase tracking-widest">${news.date}</span>
                                <span class="px-3 py-1 rounded-full bg-secondary text-background text-[10px] font-bold uppercase tracking-widest">${news.source}</span>
                            </div>
                        </div>
                        <div class="p-8 md:p-12 flex flex-col justify-center">
                            <h2 class="text-2xl md:text-3xl font-headline font-bold mb-8 leading-tight text-on-surface hover:text-secondary transition-colors cursor-default">${news.title}</h2>
                            
                            <div class="space-y-6">
                                <div>
                                    <h3 class="text-[10px] font-label uppercase tracking-[0.2em] text-secondary font-bold mb-4 opacity-80">핵심 요약 3줄</h3>
                                    <ul class="space-y-3">
                                        ${news.summary.map(s => `
                                            <li class="flex items-start gap-3 text-sm text-on-surface-variant leading-relaxed">
                                                <span class="w-1.5 h-1.5 rounded-full bg-secondary mt-1.5 flex-shrink-0"></span>
                                                ${s}
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="px-8 md:px-12 py-12 border-t border-outline-variant/10 bg-black/20">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 mb-16">
                            <div class="lg:col-span-2">
                                <div class="flex items-center gap-2 mb-6">
                                    <span class="material-symbols-outlined text-primary">analytics</span>
                                    <h3 class="text-xs font-label uppercase tracking-widest text-primary font-bold">현직자 인사이트 & 기술 해설</h3>
                                </div>
                                <div class="p-6 rounded-2xl bg-primary/5 border border-primary/10">
                                    <p class="text-on-surface-variant text-sm leading-relaxed mb-6 italic">"${news.commentary}"</p>
                                    <div class="flex items-center gap-2 text-xs font-bold text-secondary">
                                        <span class="material-symbols-outlined text-sm">lightbulb</span> [현직자 힌트]: ${news.interviewGuide.tip.split('.')[0]}.
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-6">
                                <h3 class="text-xs font-label uppercase tracking-widest text-primary font-bold flex items-center gap-2">
                                    <span class="material-symbols-outlined text-sm">hub</span> 직무별 연관성
                                </h3>
                                <div class="space-y-4">
                                    <div class="p-4 rounded-xl bg-surface-container-highest/50 border border-outline-variant/10">
                                        <span class="text-[10px] font-bold text-secondary block mb-1">공정 엔지니어</span>
                                        <p class="text-[11px] text-on-surface-variant leading-relaxed">${news.points.Process}</p>
                                    </div>
                                    <div class="p-4 rounded-xl bg-surface-container-highest/50 border border-outline-variant/10">
                                        <span class="text-[10px] font-bold text-secondary block mb-1">설계 엔지니어</span>
                                        <p class="text-[11px] text-on-surface-variant leading-relaxed">${news.points.Design}</p>
                                    </div>
                                    <div class="p-4 rounded-xl bg-surface-container-highest/50 border border-outline-variant/10">
                                        <span class="text-[10px] font-bold text-secondary block mb-1">설비 엔지니어</span>
                                        <p class="text-[11px] text-on-surface-variant leading-relaxed">${news.points.Equipment}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Interview Practice Component -->
                        <div class="p-10 rounded-[2.5rem] bg-background border border-outline-variant/20 shadow-2xl relative overflow-hidden group">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-secondary/5 blur-[50px] -z-10 group-hover:bg-secondary/10 transition-colors"></div>
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                                <div>
                                    <h3 class="text-xl font-headline font-bold flex items-center gap-3">
                                        <span class="material-symbols-outlined text-secondary text-3xl">psychology</span> 면접 대비 질문
                                    </h3>
                                    <p class="text-sm text-on-surface-variant mt-2">${news.interviewGuide.question}</p>
                                </div>
                                <button onclick="openModal('${news.id}')" class="px-6 py-2.5 rounded-full bg-surface-container-highest border border-outline-variant/30 text-xs font-bold text-on-surface hover:border-secondary transition-all flex items-center gap-2">
                                    <span class="material-symbols-outlined text-sm text-secondary">tips_and_updates</span> 답변 가이드 보기
                                </button>
                            </div>
                            <textarea 
                                id="answer-${news.id}"
                                oninput="saveAnswer('${news.id}')"
                                class="w-full interview-input border border-outline-variant/20 rounded-3xl p-6 text-sm focus:outline-none focus:border-secondary/50 transition-all min-h-[180px] resize-none leading-relaxed placeholder:opacity-30"
                                placeholder="이 기술이 도입되었을 때 예상되는 어려움과 해결방안을 구체적으로 적어보세요..."
                            ></textarea>
                            <div class="mt-4 flex justify-between items-center">
                                <div class="flex gap-2">
                                    <span class="px-2 py-1 rounded bg-white/5 text-[9px] text-on-surface-variant">#본딩저항</span>
                                    <span class="px-2 py-1 rounded bg-white/5 text-[9px] text-on-surface-variant">#신호무결성</span>
                                    <span class="px-2 py-1 rounded bg-white/5 text-[9px] text-on-surface-variant">#수율확보</span>
                                </div>
                                <span class="text-[10px] text-on-surface-variant opacity-60 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[14px] text-secondary">cloud_done</span> LocalStorage 자동 저장 중
                                </span>
                            </div>
                        </div>
                    </div>
                </article>
            `).join('');

            // Load saved answers
            window.semiData.news.forEach(news => {
                const saved = localStorage.getItem(`answer-${news.id}`);
                if (saved) {
                    document.getElementById(`answer-${news.id}`).value = saved;
                }
            });
        }

        function saveAnswer(id) {
            const val = document.getElementById(`answer-${id}`).value;
            localStorage.setItem(`answer-${id}`, val);
        }

        function openModal(id) {
            const news = window.semiData.news.find(n => n.id === id);
            modalText.innerText = news.interviewGuide.tip;
            guideModal.classList.remove('hidden');
            guideModal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                guideModal.classList.add('hidden');
                guideModal.classList.remove('flex');
            }, 300);
        }

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.innerText = 'light_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'dark');
            }
        });

        renderNewsInsight();
    </script>
</body>
</html>
