<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>뉴스 인사이트 & 면접 훈련 | SemiWiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#141f38",
                    "surface-container-highest": "#192540",
                    "primary": "#3766ff",
                    "secondary": "#bef500",
                    "background": "#060e20",
                    "on-surface": "#dee5ff",
                    "on-surface-variant": "#a3aac4",
                    "outline-variant": "#40485d"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .syntax-gradient { background: linear-gradient(135deg, #3766ff 0%, #95aaff 100%); }
        html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
        html:not(.dark) .bg-background { background-color: #f8fafc; }
        html:not(.dark) .bg-surface-container-high { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .interview-input { background: rgba(6, 14, 32, 0.4); }
        html:not(.dark) .interview-input { background: #f1f5f9; }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary selection:text-on-secondary">
    <nav class="fixed top-0 w-full z-50 bg-[#060e20]/80 backdrop-blur-xl shadow-sm border-b border-outline-variant/10">
        <div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
            <a href="index.html" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[#bef500] text-3xl">memory</span>
                <div class="text-2xl font-bold text-[#dee5ff] tracking-tighter font-headline">SemiWiki</div>
            </a>
            <div class="hidden md:flex items-center gap-10">
                <a class="text-[#bef500] transition-colors font-headline" href="news.html">뉴스 인사이트</a>
                <a class="text-[#dee5ff] hover:text-[#3766ff] transition-colors font-headline" href="quiz.html">반도체 퀴즈</a>
                <a class="text-[#dee5ff] hover:text-[#3766ff] transition-colors font-headline" href="dictionary.html">용어사전</a>
                <a class="text-[#dee5ff] hover:text-[#3766ff] transition-colors font-headline" href="careers.html">취업로드맵</a>
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-xl bg-surface-container-high border border-outline-variant/20 flex items-center justify-center">
                    <span id="theme-icon" class="material-symbols-outlined text-secondary">dark_mode</span>
                </button>
                <a href="index.html" class="text-sm font-label text-on-surface-variant hover:text-secondary">메인으로</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-8 max-w-5xl mx-auto">
        <header class="mb-16">
            <h1 class="font-headline text-4xl md:text-5xl font-bold tracking-tight mb-4">뉴스 인사이트 & 면접 훈련</h1>
            <p class="text-on-surface-variant text-lg">최신 뉴스를 현직자의 시선으로 분석하고, 나만의 면접 답변을 설계해보세요.</p>
        </header>

        <div id="news-insight-container" class="space-y-12">
            <!-- News Insight Card will be injected here -->
        </div>
    </main>

    <!-- Modal for Interview Guide -->
    <div id="guide-modal" class="fixed inset-0 z-[100] hidden items-center justify-center px-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-surface-container-high w-full max-w-lg rounded-[2.5rem] border border-outline-variant/20 p-8 md:p-12 shadow-2xl scale-95 opacity-0 transition-all duration-300" id="modal-content">
            <div class="flex items-center gap-3 mb-6">
                <span class="material-symbols-outlined text-secondary text-3xl">lightbulb</span>
                <h3 class="text-2xl font-headline font-bold">합격자 답변 가이드</h3>
            </div>
            <div id="modal-text" class="text-on-surface-variant leading-relaxed mb-10 whitespace-pre-line"></div>
            <button onclick="closeModal()" class="w-full syntax-gradient text-white py-4 rounded-xl font-bold font-headline hover:scale-[1.02] transition-all">확인했습니다</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/glossary.js"></script>
    <script>
        const newsInsightContainer = document.getElementById('news-insight-container');
        const guideModal = document.getElementById('guide-modal');
        const modalContent = document.getElementById('modal-content');
        const modalText = document.getElementById('modal-text');

        function renderNewsInsight() {
            const newsList = window.semiData.news;
            newsInsightContainer.innerHTML = newsList.map(news => `
                <article class="bg-surface-container-high rounded-[3rem] border border-outline-variant/10 overflow-hidden shadow-xl">
                    <div class="grid grid-cols-1 lg:grid-cols-2">
                        <img src="${news.image}" class="w-full h-full object-cover min-h-[300px]" alt="${news.title}">
                        <div class="p-8 md:p-12">
                            <div class="flex items-center gap-3 mb-6">
                                <span class="px-3 py-1 rounded-full bg-secondary/10 text-secondary text-[10px] font-bold uppercase tracking-widest">${news.date}</span>
                                <span class="px-3 py-1 rounded-full bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-widest">Industry Insight</span>
                            </div>
                            <h2 class="text-2xl md:text-3xl font-headline font-bold mb-6 leading-tight">${news.title}</h2>
                            
                            <div class="space-y-4 mb-8">
                                <h3 class="text-xs font-label uppercase tracking-widest text-secondary font-bold">핵심 요약 3줄</h3>
                                <ul class="space-y-2">
                                    ${news.summary.map(s => `
                                        <li class="flex items-start gap-3 text-sm text-on-surface-variant">
                                            <span class="w-1.5 h-1.5 rounded-full bg-secondary mt-1.5 flex-shrink-0"></span>
                                            ${s}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="px-8 md:px-12 py-12 border-t border-outline-variant/10 bg-black/10">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                            <div class="col-span-1 md:col-span-2">
                                <h3 class="text-xs font-label uppercase tracking-widest text-primary font-bold mb-4 flex items-center gap-2">
                                    <span class="material-symbols-outlined text-sm">engineering</span> 현직자 기술 해설
                                </h3>
                                <p class="text-on-surface-variant text-sm leading-relaxed">${news.commentary}</p>
                            </div>
                            <div>
                                <h3 class="text-xs font-label uppercase tracking-widest text-primary font-bold mb-4">직무별 관전 포인트</h3>
                                <div class="space-y-3">
                                    <div class="text-[11px]"><span class="text-secondary font-bold mr-2">공정:</span> ${news.points.Process}</div>
                                    <div class="text-[11px]"><span class="text-secondary font-bold mr-2">설계:</span> ${news.points.Design}</div>
                                    <div class="text-[11px]"><span class="text-secondary font-bold mr-2">설비:</span> ${news.points.Equipment}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Interview Practice Component -->
                        <div class="mt-12 p-8 rounded-[2rem] bg-background border border-outline-variant/20 shadow-inner">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                <h3 class="text-xl font-headline font-bold flex items-center gap-2">
                                    <span class="material-symbols-outlined text-secondary">edit_note</span> 나만의 면접 답변 만들기
                                </h3>
                                <button onclick="openModal('${news.id}')" class="text-xs font-bold text-secondary flex items-center gap-1 hover:underline">
                                    <span class="material-symbols-outlined text-sm">tips_and_updates</span> 작성 가이드 보기
                                </button>
                            </div>
                            <p class="text-sm text-on-surface-variant mb-6 font-medium">질문: ${news.interviewGuide.question}</p>
                            <textarea 
                                id="answer-${news.id}"
                                oninput="saveAnswer('${news.id}')"
                                class="w-full interview-input border border-outline-variant/20 rounded-2xl p-5 text-sm focus:outline-none focus:border-secondary/50 transition-all min-h-[150px] resize-none"
                                placeholder="이 기술이 현업에 적용될 때 예상되는 문제점과 해결방안은 무엇일까요? 자신의 생각을 적어보세요..."
                            ></textarea>
                            <div class="mt-4 flex justify-end">
                                <span class="text-[10px] text-on-surface-variant opacity-60 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[12px]">cloud_done</span> 브라우저에 자동 저장됨
                                </span>
                            </div>
                        </div>
                    </div>
                </article>
            `).join('');

            // Load saved answers
            window.semiData.news.forEach(news => {
                const saved = localStorage.getItem(`answer-${news.id}`);
                if (saved) {
                    document.getElementById(`answer-${news.id}`).value = saved;
                }
            });
        }

        function saveAnswer(id) {
            const val = document.getElementById(`answer-${id}`).value;
            localStorage.setItem(`answer-${id}`, val);
        }

        function openModal(id) {
            const news = window.semiData.news.find(n => n.id === id);
            modalText.innerText = news.interviewGuide.tip;
            guideModal.classList.remove('hidden');
            guideModal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                guideModal.classList.add('hidden');
                guideModal.classList.remove('flex');
            }, 300);
        }

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.innerText = 'light_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'dark');
            }
        });

        renderNewsInsight();
    </script>
</body>
</html>
