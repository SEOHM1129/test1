<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>반도체 용어 사전 | SemiWiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#141f38",
                    "surface-container-highest": "#192540",
                    "primary": "#3766ff",
                    "secondary": "#bef500",
                    "background": "#060e20",
                    "on-surface": "#dee5ff",
                    "on-surface-variant": "#a3aac4",
                    "outline-variant": "#40485d"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Manrope"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .syntax-gradient { background: linear-gradient(135deg, #3766ff 0%, #95aaff 100%); }
        html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
        html:not(.dark) .bg-background { background-color: #f8fafc; }
        html:not(.dark) .bg-surface-container-high { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .term-card { transition: all 0.3s ease; }
        .term-card:hover { transform: translateY(-2px); border-color: rgba(190, 245, 0, 0.3); }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary selection:text-on-secondary">
    <nav class="fixed top-0 w-full z-50 bg-[#060e20]/80 backdrop-blur-xl shadow-sm border-b border-outline-variant/10">
        <div class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto">
            <a href="index.html" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[#bef500] text-3xl">memory</span>
                <div class="text-2xl font-bold text-[#dee5ff] tracking-tighter font-headline">SemiWiki</div>
            </a>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="p-2 rounded-xl bg-surface-container-high border border-outline-variant/20 flex items-center justify-center">
                    <span id="theme-icon" class="material-symbols-outlined text-secondary">dark_mode</span>
                </button>
                <a href="index.html" class="text-sm font-label text-on-surface-variant hover:text-secondary">메인으로</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-24 px-8 max-w-5xl mx-auto">
        <header class="mb-16 text-center">
            <h1 class="font-headline text-4xl md:text-5xl font-bold tracking-tight mb-6">반도체 용어 사전</h1>
            <p class="text-on-surface-variant text-lg max-w-2xl mx-auto">복잡한 반도체 기술 용어를 한곳에서 검색하고 학습하세요.</p>
        </header>

        <!-- Search Bar -->
        <div class="relative mb-16 max-w-2xl mx-auto">
            <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
            <input type="text" id="search-input" placeholder="용어 검색 (예: HBM, EUV, 노광...)" class="w-full bg-surface-container-high border border-outline-variant/20 rounded-2xl py-5 pl-14 pr-6 text-lg focus:outline-none focus:border-secondary/50 transition-all shadow-lg">
        </div>

        <!-- Filter Chips -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="category-filters">
            <button class="filter-chip px-5 py-2 rounded-full bg-secondary text-background font-bold text-sm transition-all" data-category="all">전체</button>
            <button class="filter-chip px-5 py-2 rounded-full bg-surface-container-high border border-outline-variant/20 text-on-surface-variant hover:text-on-surface font-medium text-sm transition-all" data-category="Memory">Memory</button>
            <button class="filter-chip px-5 py-2 rounded-full bg-surface-container-high border border-outline-variant/20 text-on-surface-variant hover:text-on-surface font-medium text-sm transition-all" data-category="Process">Process</button>
            <button class="filter-chip px-5 py-2 rounded-full bg-surface-container-high border border-outline-variant/20 text-on-surface-variant hover:text-on-surface font-medium text-sm transition-all" data-category="Lithography">Lithography</button>
            <button class="filter-chip px-5 py-2 rounded-full bg-surface-container-high border border-outline-variant/20 text-on-surface-variant hover:text-on-surface font-medium text-sm transition-all" data-category="Logic">Logic</button>
        </div>

        <!-- Dictionary Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="dictionary-grid">
            <!-- Terms will be injected here -->
        </div>

        <div id="no-results" class="hidden text-center py-20">
            <span class="material-symbols-outlined text-6xl text-outline-variant mb-4">search_off</span>
            <p class="text-on-surface-variant">검색 결과가 없습니다.</p>
        </div>
    </main>

    <script src="js/data.js?v=096e3dd"></script>
    <script>
        const dictionary = window.semiData.dictionary;
        const grid = document.getElementById('dictionary-grid');
        const searchInput = document.getElementById('search-input');
        const filterChips = document.querySelectorAll('.filter-chip');
        const noResults = document.getElementById('no-results');

        let currentCategory = 'all';
        let searchQuery = '';

        function renderDictionary() {
            grid.innerHTML = '';
            let count = 0;

            Object.entries(dictionary).forEach(([term, data]) => {
                const matchesSearch = term.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     data.def.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = currentCategory === 'all' || data.category === currentCategory;

                if (matchesSearch && matchesCategory) {
                    count++;
                    const card = document.createElement('div');
                    card.className = 'term-card bg-surface-container-high p-8 rounded-3xl border border-outline-variant/10 flex flex-col h-full';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-2xl font-headline font-bold text-secondary">${term}</h3>
                            <span class="px-3 py-1 rounded-md bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-wider">${data.category}</span>
                        </div>
                        <p class="text-on-surface-variant leading-relaxed text-sm flex-grow">${data.def}</p>
                    `;
                    grid.appendChild(card);
                }
            });

            if (count === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderDictionary();
        });

        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => {
                    c.classList.remove('bg-secondary', 'text-background', 'font-bold');
                    c.classList.add('bg-surface-container-high', 'border-outline-variant/20', 'text-on-surface-variant');
                });
                chip.classList.add('bg-secondary', 'text-background', 'font-bold');
                chip.classList.remove('bg-surface-container-high', 'border-outline-variant/20', 'text-on-surface-variant');
                
                currentCategory = chip.dataset.category;
                renderDictionary();
            });
        });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;
        themeToggleBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.innerText = 'light_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.innerText = 'dark_mode';
                localStorage.setItem('theme', 'dark');
            }
        });

        // Initial render
        renderDictionary();
    </script>
</body>
</html>

        // Initial render
        renderDictionary();
    </script>
</body>
</html>
